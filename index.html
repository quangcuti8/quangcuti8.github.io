<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IZO Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0e0d0c;--glow:rgba(244,161,0,.10);--surface:#171513;--surface-2:#1e1b18;--line:#2b2723;--line-strong:#3b352f;
--fg:#f4f0ea;--muted:#a1988e;--faint:#7d756c;--accent:#f4a100;--accent-ink:#1a1200;--danger:#ff8a7a;--ok:#4cc38a;--ok-ink:#06210f;
--font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(56rem 26rem at 50% -4rem,var(--glow),transparent 70%),var(--bg);background-color:var(--bg);
color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.brandlink{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;letter-spacing:.02em}
.mark{width:40px;height:40px;border-radius:10px;display:block}
.out{font-size:13.5px;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
.out:hover{color:var(--fg);border-color:var(--line-strong)}
h1{margin:0;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted)}
.crumb{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;color:var(--muted);text-decoration:none;font-size:13.5px}
.crumb:hover{color:var(--accent)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:26px}
.tile{grid-column:span 2;position:relative;display:flex;flex-direction:column;gap:6px;min-height:156px;padding:20px 20px 18px;border-radius:16px;
background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s,background-color .15s}
.tile:hover{border-color:var(--line-strong);transform:translateY(-2px);background:var(--surface-2)}
.tile:focus-visible,.btn:focus-visible,.out:focus-visible,.crumb:focus-visible,.brandlink:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tile.wide{grid-column:span 3}
.kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.ttl{font-size:18px;line-height:1.3;font-weight:600;text-wrap:balance;padding-right:28px}
.meta{margin-top:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.arrow{position:absolute;top:18px;right:18px;font-size:20px;color:var(--faint);transition:transform .15s,color .15s}
.tile:hover .arrow{transform:translateX(3px);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--danger)}
.tile.add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.add:hover{background:#ffb21a}
.tile.add .kick,.tile.add .meta,.tile.add .arrow{color:rgba(26,18,0,.72)}
.tile.add:hover .arrow{color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;font:inherit;font-size:14.5px;font-weight:600;
border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--fg);cursor:pointer;text-decoration:none;transition:filter .15s,border-color .15s}
.btn:hover{border-color:#4a433b}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.ok:hover{filter:brightness(1.08)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:none;color:var(--muted)}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.name{font-weight:700;color:var(--accent);overflow-wrap:anywhere}
.nl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px;color:var(--muted)}
.chips b{font-weight:500;color:var(--faint);margin-right:4px}
.bdg{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line-strong);color:var(--muted)}
.bdg.g{color:var(--ok);border-color:rgba(76,195,138,.5);background:rgba(76,195,138,.1)}
.bdg.r{color:var(--danger);border-color:rgba(255,138,122,.5);background:rgba(255,138,122,.1)}
.bdg.y{color:var(--accent);border-color:rgba(244,161,0,.5);background:rgba(244,161,0,.1)}
.panel2{margin-bottom:20px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.panel2 h2{margin:0 0 16px;font-size:17px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 16px}
.fgrid .s2{grid-column:1/-1}
.fgrid label{margin-bottom:6px}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.lnk{min-width:0;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk a{text-decoration:underline;text-underline-offset:3px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mu{color:var(--faint)}
.empty{padding:40px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.form{display:grid;gap:16px;max-width:640px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
label{display:block;margin-bottom:7px;font-size:13px;font-weight:500;color:var(--muted)}
select,textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:11px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
select{height:46px;padding-block:0}
textarea{min-height:170px;resize:vertical;line-height:1.55}
select:focus-visible,textarea:focus-visible,input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(244,161,0,.22)}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--faint)}
.msg{min-height:22px;font-size:14px;color:var(--muted)}
.msg.good{color:var(--ok)}.msg.bad{color:var(--danger)}
.msg a{color:var(--accent)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:12px}
.rrow .who{font-size:13px;color:var(--muted);margin-top:2px}
.rrow .who a{color:var(--muted)}
.rrow input{height:40px;padding:0 12px;font-size:14.5px}
a.name{text-decoration:none}a.name:hover{text-decoration:underline;text-underline-offset:3px}
.name.red{color:var(--danger)}
.alert{margin-top:5px;color:var(--danger);font-size:13.5px;font-weight:600}
.rcard{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:12px}
.rcard .who{font-size:13px;color:var(--muted);margin:2px 0 10px}.rcard .who a{color:var(--muted)}
.nrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.nrow .t{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.cardx{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;min-width:0}
.cardx h2{margin:0 0 4px;font-size:17px}
.cardx .sum{margin:0 0 12px;color:var(--muted);font-size:14px;min-height:21px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;margin-bottom:16px}
.grid2 .cardx{margin-bottom:0}
.inl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0 10px}
.inl>div{flex:1 1 170px;min-width:0}
.inl .btn{flex:0 0 auto}
.scx{overflow-x:auto}
table.h{width:100%;border-collapse:collapse;min-width:480px}
table.h th,table.h td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
table.h th{color:var(--faint);font-weight:500;font-size:12.5px;border-top:0}
table.h input{height:38px;padding:0 10px;font-size:14.5px;width:100%;max-width:170px}
.up{color:var(--ok)}.dn{color:var(--danger)}
svg text{fill:var(--muted);font-size:13px}
svg text.vl{fill:var(--fg);font-weight:700;font-size:13.5px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font-size:12.5px;color:var(--faint)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.zone{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 16px;border:2px dashed var(--line-strong);border-radius:14px;background:var(--surface-2);color:var(--muted);cursor:pointer;outline:none;transition:border-color .15s,background-color .15s}
.zone:hover,.zone.drag{border-color:var(--accent)}
.zone:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(244,161,0,.22)}
.zone strong{color:var(--fg);font-weight:600}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.shot{min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shot .th{display:block;width:100%;aspect-ratio:16/10;padding:0;border:0;background:#000;cursor:zoom-in}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.shot .cap{padding:10px 12px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.shot .cap b{display:block;color:var(--fg);font-weight:600;font-size:13.5px}
.shot .cap .btn{margin-top:8px}
#lb{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:rgba(8,7,6,.92);cursor:zoom-out}
#lb img{max-width:100%;max-height:82vh;border-radius:8px;display:block}
#lb p{margin:0;color:var(--muted);font-size:14px;text-align:center}
button.tile{font:inherit;text-align:left;cursor:pointer;width:100%}
.tw{grid-column:span 2;position:relative;display:flex;min-width:0}
.tw .tile{grid-column:auto;flex:1;min-width:0}
.tw .meta{padding-right:96px}
.tdel{position:absolute;right:14px;bottom:14px;height:32px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;cursor:pointer}
.tdel:hover{color:var(--danger);border-color:var(--danger)}
.tdel.sure{color:#1a0805;background:var(--danger);border-color:var(--danger)}
.tdel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.asg{height:34px!important;padding:0 8px!important;font-size:13.5px!important;width:auto!important;max-width:190px}
table.h.big{min-width:1040px}
table.h.big td{font-size:13.5px}
table.h.big .lnk{max-width:200px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tile.full{grid-column:1/-1;min-height:0;flex-direction:column}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stp{padding:4px 12px;border-radius:99px;border:1px solid var(--line-strong);font-size:13px;color:var(--muted);background:var(--surface)}
.stp b{color:var(--fg);font-weight:600}.stp.bad b{color:var(--danger)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.tools input{flex:1 1 260px;min-width:0}.tools select{flex:0 1 240px;min-width:0}
table.sheet{border-collapse:collapse;min-width:1400px;width:100%;font-size:13px;background:#fff;color:#1f1f1f;table-layout:auto}
table.sheet th{background:#f3f3f3;color:#111;font-weight:700;text-align:center;border:1px solid #d0d0d0;padding:5px 8px;position:sticky;top:0;white-space:nowrap}
table.sheet td{border:1px solid #e1e1e1;padding:3px 8px;text-align:center;white-space:nowrap;height:24px}
table.sheet td.l{text-align:left;overflow:hidden;text-overflow:ellipsis}
table.sheet .c1{max-width:70px;min-width:60px}.c2{max-width:380px}.c3{max-width:260px}
table.sheet tbody tr:hover td{background:#f5f9ff}
table.sheet a{color:#1155cc;text-decoration:underline}
table.sheet a.nm{color:#1f1f1f;text-decoration:none;font-weight:500}
table.sheet a.nm:hover{text-decoration:underline}
table.sheet a.nm.red{color:#d93025;font-weight:700}
table.sheet select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#222;max-width:170px}
.efg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table.sheet .xb{font:inherit;font-size:12px;padding:2px 8px;border:1px solid #ddd;border-radius:4px;background:#fafafa;color:#666;cursor:pointer}
table.sheet .xb:hover{color:#d93025;border-color:#d93025}
table.h.big{min-width:1180px}
.idc{font-size:12px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.h.big tbody tr:nth-child(even) td{background:rgba(255,255,255,.018)}
table.h.big tbody tr:hover td{background:rgba(255,255,255,.04)}
table.h.big td{padding:10px 8px}
.sub2{margin-top:2px;font-size:12px;color:var(--faint);white-space:nowrap}
.sub2 a{color:var(--muted);text-underline-offset:2px}
.pv{margin-top:14px;padding:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.pv .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pv table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.pv th,.pv td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.pv th{color:var(--faint);font-weight:500;border-top:0}
.pv .more{margin:8px 0 0;font-size:12.5px;color:var(--faint)}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.panel{max-width:380px;text-align:center;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.panel h1{font-size:21px;margin-bottom:8px}.panel p{color:var(--muted);margin:0 0 18px}
@media(max-width:760px){.tile,.tile.wide,.tw{grid-column:1/-1;min-height:0}.tw .meta{padding-right:0;padding-bottom:40px}.row,.rrow{grid-template-columns:minmax(0,1fr)}.acts{justify-content:flex-start}h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.sync{font-size:12.5px;color:var(--faint);white-space:nowrap}.sync.busy{color:var(--muted)}.sync.ok{color:#5fcf94}.sync.err{color:var(--danger)}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.uname{font-size:13.5px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctxwrap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
#ctxwrap select{padding:6px 8px;font-size:13px;max-width:180px}
.note{margin:0 0 16px;padding:11px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:14px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note a{color:var(--fg)}
@media(max-width:640px){.top{align-items:flex-start;flex-direction:column}.hdr{justify-content:flex-start}}
</style>

/* ---------- Hàng đợi ghi (mỗi tài liệu một lần, tối đa 3 song song) ---------- */
var OPS={},QQ=[],QIN={},QACT={},QDIRTY={},QN=0,QERR=0;
function qadd(key,op){OPS[key]=op;if(QACT[key]){QDIRTY[key]=1}else if(!QIN[key]){QIN[key]=1;QQ.push(key)}qpump();syncUi()}
function qpump(){while(QN<3&&QQ.length){var key=QQ.shift();QIN[key]=0;qrun(key,0)}}
function qrun(key,tries,op0){
  var op=op0||OPS[key];if(!op)return;
  if(!op0)delete OPS[key];
  QN++;QACT[key]=1;
  var p=op.del?DB.doc(key).delete():DB.doc(key).set(op.data);
  p.then(function(){qend(key)},function(e){
    var c=e&&e.code;
    if(tries<3&&(c==="unavailable"||c==="resource_exhausted")){
      QN--;
      setTimeout(function(){
        if(OPS[key]){QACT[key]=0;QDIRTY[key]=0;if(!QIN[key]){QIN[key]=1;QQ.push(key)}qpump();syncUi()}
        else{qrun(key,tries+1,op)}},700*(tries+1));
      return}
    QERR++;qend(key)});
}
function qend(key){QN--;QACT[key]=0;if(QDIRTY[key]){QDIRTY[key]=0;if(OPS[key]&&!QIN[key]){QIN[key]=1;QQ.push(key)}}qpump();syncUi()}
function pending(){return QN+QQ.length}
function syncUi(){
  var el=$("syncst");if(!el)return;
  if(!DB){el.textContent="Lưu trên trình duyệt";el.className="sync";return}
  if(pending()){el.textContent="Đang lưu…";el.className="sync busy"}
  else if(QERR){el.textContent="Lỗi lưu: tài khoản chỉ có quyền xem hoặc mất kết nối";el.className="sync err"}
  else{el.textContent="Đã lưu";el.className="sync ok"}}
function docPath(col,id){return"staff/"+CTX+"/"+col+"/"+id}
function syncDocs(col,arr,prev){
  var seen={};
  arr.forEach(function(k){var id=String(k.id);seen[id]=1;var j=JSON.stringify(k);
    if(prev[id]!==j){prev[id]=j;qadd(docPath(col,id),{data:JSON.parse(j)})}});
  Object.keys(prev).forEach(function(id){if(!seen[id]){delete prev[id];qadd(docPath(col,id),{del:1})}});
}

  ch.sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
  CHJ=JSON.stringify(ch);LSJ=JSON.stringify(ls);PREV={};PREVL={};
  ch.forEach(function(k){PREV[String(k.id)]=JSON.stringify(k)});ls.forEach(function(k){PREVL[String(k.id)]=JSON.stringify(k)});
}

var ORDER=["cid","url","name","mail","cms","partner","date","status","cat","reviewer"];
var HDR={"id":"cid","id kênh":"cid","link":"url","link kênh":"url","channels":"url","channel":"url","url":"url","tên":"name","tên kênh":"name","name":"name","mail kênh":"mail","mail cầm kênh":"mail","mail":"mail","email":"mail","cms":"cms","đối tác":"partner","doi tac":"partner","partners":"partner","partner":"partner","date":"date","ngày":"date","status":"status","trạng thái":"status","thể loại":"cat","category":"cat","người review":"reviewer","reviewer":"reviewer"};
function parseGrid(t){
  var first=t.split(/\r?\n/,1)[0],d=first.indexOf("\t")>=0?"\t":first.indexOf("|")>=0?"|":",";
  var out=[],row=[],c="",q=false,i,ch;
  for(i=0;i<t.length;i++){ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"'&&c==="")q=true;
    else if(ch===d){row.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(c);c="";if(row.some(function(x){return x.trim()}))out.push({n:0,cells:row});row=[]}
    else c+=ch}
  row.push(c);if(row.some(function(x){return x.trim()}))out.push({n:0,cells:row});
  return out.map(function(r,k){r.n=k+1;return r});
}
function toIso(s){s=String(s||"").trim();if(!s)return"";
  var m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(s),y,mo,dd;
  if(m){y=m[3].length===2?"20"+m[3]:m[3];mo=+m[2];dd=+m[1]}
  else{m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(s);if(!m)return"";y=m[1];mo=+m[2];dd=+m[3]}
  if(mo<1||mo>12||dd<1||dd>31)return"";
  return y+"-"+(mo<10?"0":"")+mo+"-"+(dd<10?"0":"")+dd}
function parseSheet(text){
  var g=parseGrid(String(text||"").replace(/^﻿/,"")),keys=ORDER,start=0,rows=[],bad=[],warn=[];
  if(g.length){
    var hk=g[0].cells.map(function(h){return HDR[String(h).trim().toLowerCase()]||null});
    if(hk.filter(Boolean).length>=3){keys=hk;start=1}
  }
  for(var i=start;i<g.length;i++){
    var r={},cells=g[i].cells,line=g[i].n;
    keys.forEach(function(k,j){if(k&&cells[j]!==undefined)r[k]=String(cells[j]).trim()});
    var name=r.name||"",url=r.url||"";
    if(normUrl(name)&&!normUrl(url)){var t=name;name=url;url=t}
    var u=normUrl(url);
    if(url&&!u)warn.push("Dòng "+line+": link không đúng định dạng nên bỏ qua link");
    var cid=r.cid||"",m=/channel\/(UC[\w-]+)/.exec(u);
    if(!cid&&m)cid=m[1];
    if(!u&&/^UC[\w-]{10,}$/.test(cid))u="https://www.youtube.com/channel/"+cid;
    if(!name){bad.push("Dòng "+line+": thiếu tên kênh");continue}
    var dt=toIso(r.date);if(r.date&&!dt)warn.push("Dòng "+line+": Date \""+r.date+"\" không đọc được nên để trống");
    rows.push({cid:cid,url:u,name:name,mail:r.mail||"",cms:r.cms||"",partner:r.partner||"",date:dt,status:r.status||"",cat:r.cat||"",reviewer:r.reviewer||""});
  }
  return{rows:rows,bad:bad,warn:warn,total:g.length-start};
}
function importRows(rows,staff){
  var all=load(),added=0,updated=0,skipped=[];
  rows.forEach(function(r){
    var ex=all.filter(function(k){return(r.cid&&k.cid&&k.cid===r.cid)||(r.url&&k.url&&k.url.toLowerCase()===r.url.toLowerCase())})[0];
    if(ex){
      if(ex.staff==null||String(ex.staff)===""){ex.staff=staff}
      else if(String(ex.staff)!==String(staff)){skipped.push("\""+r.name+"\" đã có ở "+listName(ex.staff));return}
      ORDER.forEach(function(f){if(r[f])ex[f]=r[f]});updated++;return}
    var rec={id:uid(),staff:staff,remind:false};ORDER.forEach(function(f){rec[f]=r[f]});all.push(rec);added++;
  });
  save(all);return{added:added,updated:updated,skipped:skipped};
}
function reportHtml(p,imp){
  var h='<b>Đã thêm '+imp.added+' kênh'+(imp.updated?', cập nhật '+imp.updated+' kênh đã có':'')+'.</b>';
  var issues=p.bad.concat(imp.skipped).concat(p.warn);
  if(issues.length){h+='<br><span style="color:var(--muted)">Cần xem lại ('+issues.length+'):</span><ul style="margin:6px 0 0;padding-left:20px;color:var(--muted)">'+

  return h;
}

\" type=\"button\" id=\"acancel\">Hủy<\/button><\/div>\n<\/form>\n<div class=\"tools\"><label class=\"sr\" for=\"aq\">Tìm kênh<\/label><input type=\"text\" id=\"aq\" autocomplete=\"off\" placeholder=\"Tìm theo tên, ID, link, đối tác, người review…\"><label class=\"sr\" for=\"lf\">Lọc theo danh sách<\/label><select id=\"lf\"><\/select><\/div>\n<div class=\"scx\" style=\"border-radius:10px;overflow:auto;max-height:78vh;margin-bottom:0\" id=\"atable\"><\/div>\n<div id=\"amore\" style=\"text-align:center;margin-top:14px\" hidden><button class=\"btn\" id=\"amorebtn\" type=\"button\">Hiện thêm<\/button><\/div>\n", "nhac-nho": "\n<a class=\"crumb\" href=\"#/\">← Trang chủ<\/a>\n<div class=\"head\"><div><h1>Danh sách các kênh cần nhắc nhở<\/h1><p class=\"lead\" id=\"count\"><\/p><\/div><\/div>\n<div class=\"list\" id=\"list\"><\/div>\n", "nhan-vien": "\n<a class=\"crumb\" href=\"#/\">← Trang chủ<\/a>\n<div class=\"head\"><div><h1>Nhân viên &amp; tài khoản<\/h1><\/div><\/div>\n<div class=\"panel2\" style=\"margin-bottom:18px\">\n<h2>Cách tạo tài khoản cho nhân viên<\/h2>\n<ol style=\"margin:0;padding-left:20px;color:var(--muted);line-height:1.8;font-size:14px\">\n<li>Mở nút <b style=\"color:var(--fg)\">Chia sẻ<\/b> (Share) của trang này trên Claude.<\/li>\n<li>Mời nhân viên bằng email, chọn quyền <b style=\"color:var(--fg)\">Contributor<\/b> (nhân viên: xem và nhập dữ liệu của mình) hoặc <b style=\"color:var(--fg)\">Editor<\/b> (quản trị: xem được dữ liệu của mọi người).<\/li>\n<li>Nhân viên mở link, đăng nhập bằng tài khoản Claude của họ rồi bấm \"Vào hệ thống\". Họ sẽ tự xuất hiện trong danh sách bên dưới.<\/li>\n<\/ol>\n<p class=\"hint\" style=\"margin-top:12px\">Mỗi nhân viên có kho dữ liệu riêng và chỉ thấy dữ liệu của mình. Quản trị viên xem và sửa được dữ liệu của tất cả nhân viên.<\/p>\n<\/div>\n<div class=\"cardx scx\" style=\"padding:6px 14px\" id=\"tm\"><div class=\"empty\" style=\"border:0;background:none\">Đang tải…<\/div><\/div>\n"};
var ROUTES={"":"home","ds":"ds","kenh":"kenh","tat-ca":"tat-ca","nhac-nho":"nhac-nho","nhan-vien":"nhan-vien"};
var routing=0;
async function route(){
  var my=++routing;
  var h=(location.hash||"").replace(/^#\/?/,""),parts=h.split("/"),nm=ROUTES[parts[0]]||"home";
  try{ARG=decodeURIComponent(parts.slice(1).join("/"))}catch(e){ARG=parts.slice(1).join("/")}
  if(!authed()){showGate();return}
  $("gate").hidden=true;$("app").hidden=false;
  G.clear();
  if(DB&&!pending()){try{await hydrate()}catch(e){}}
  if(my!==routing)return;
  $("view").innerHTML=VBODY[nm];
  try{VIEWS[nm]()}catch(e){console.error(e);$("view").innerHTML='<div class="empty"><b>Có lỗi khi mở trang.</b>Hãy tải lại trang.<br><a class="btn primary" href="#/">Về trang chủ</a></div>'}
  syncUi();try{window.scrollTo(0,0)}catch(e){}
}
function showGate(){$("app").hidden=true;$("gate").hidden=false}
window.addEventListener("hashchange",route);
window.addEventListener("beforeunload",function(e){if(DB&&pending()){e.preventDefault();e.returnValue=""}});
$("logout").addEventListener("click",function(e){e.preventDefault();try{sessionStorage.removeItem(AUTH)}catch(x){}location.hash="#/";showGate()});
$("ctxsel").addEventListener("change",function(){setCtx($("ctxsel").value)});
$("genter").addEventListener("click",function(){try{sessionStorage.setItem(AUTH,"1")}catch(e){}if(location.hash&&location.hash!=="#/")route();else{location.hash="#/";route()}});
(async function boot(){
  var wait=function(p){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},12000)})])};
  try{USER=await wait(window.claude.use("user"))}catch(e){USER=null}
  var d=null;try{d=await wait(window.claude.use("db"))}catch(e){d=null}
  var name="";
  if(USER){try{var me=await USER.me();ME=me.id;name=me.name;ADMIN=await USER.canEdit()}catch(e){}}
  if(d&&ME){
    DB=d;CTX=ME;
    try{var sc=sessionStorage.getItem("izoCtx");if(sc&&ADMIN)CTX=sc}catch(e){}
    try{
      var td=DB.doc("team/"+ME),cur=await td.get();
      if(!cur.exists||(cur.data()||{}).seen!==today())await td.set({id:ME,seen:today()});
      if(ADMIN)await loadTeam(false);
      if(CTX!==ME&&!TEAM.some(function(m){return m.id===CTX}))CTX=ME;
      await hydrate();
    }catch(e){console.error(e);DB=null;$("gnote").textContent="Không kết nối được kho dữ liệu chung. Đang lưu tạm trên trình duyệt này."}
  }
  $("uname").textContent=name||"";
  $("gwho").textContent=name?("Xin chào, "+name):"Chào mừng bạn đến IZO Network";
  if(!DB&&!$("gnote").textContent)$("gnote").textContent="Chưa kết nối kho dữ liệu chung: dữ liệu chỉ lưu trên trình duyệt này.";
  $("genter").disabled=false;
  fillCtx();syncUi();
  if(authed())route();else showGate();
})();

</script>
